name: inspec_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^8.0.3
  flutter_riverpod: ^2.5.1
  http: ^1.6.0
  intl: ^0.20.2
  side_navigation: ^1.0.4
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  mobile_scanner: ^7.1.3
  share_plus: ^12.0.2
  docs_gee: ^1.0.1
  pdf: ^3.11.3
  smooth_page_indicator: ^2.0.1
  url_launcher: ^6.3.2
  app_links: ^6.3.3
  printing: ^5.14.3
  path: ^1.9.1
  external_path: ^2.2.0
  permission_handler: ^12.0.1
  mailer: ^7.1.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.7
  random_string: ^2.3.1
  connectivity_plus: ^7.1.1
  bcrypt: ^1.2.0
  flutter_image_compress: ^2.4.0
  analyzer: ^6.4.1
  file_picker: ^11.0.2
  archive: ^4.0.9
  workmanager: ^0.6.0
  syncfusion_flutter_pdf: ^33.2.13
  syncfusion_flutter_xlsio: ^33.2.13
  pdf_merger: ^0.0.6
  convert: ^3.1.2
  gal: ^2.3.3
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Build runner et hive_generator avec versions compatibles
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_grey.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_grey.jpg"

flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  web: false
  android_12:
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icon/
    - assets/images/
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
